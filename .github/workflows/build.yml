name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release \
                   -DBUILD_BURIED_EXAMPLES=ON \
                   -DBUILD_BURIED_TEST=ON

      - name: Build
        run: cmake --build build -j2

      - name: Unit test
        run: ctest --test-dir build --output-on-failure

      - name: Integration test (HTTP + HTTPS + dedup)
        if: runner.os == 'Linux'
        run: bash server/test_report.sh build
